spring:
  datasource:
    url: jdbc:h2:mem:preppilot;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

preppilot:
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret
    expiry-minutes: 60
  limits:
    free-dsa-per-day: 3
    free-design-per-week: 1
    free-max-tier: MEDIUM
    free-max-seniority: SENIOR
    free-history-days: 7

coaching:
  engine: template

stripe:
  secret-key: ""
  webhook-secret: whsec_test_secret_for_unit_tests
  price-id: price_test
  success-url: http://localhost/ok
  cancel-url: http://localhost/cancel
  portal-return-url: http://localhost/billing
  allow-live: false
