spring:
  datasource:
    url: jdbc:h2:mem:preppilot;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

preppilot:
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret
    expiry-minutes: 60

coaching:
  engine: template
