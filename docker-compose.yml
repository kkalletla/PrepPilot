services:
  postgres:
    image: postgres:16-alpine
    container_name: preppilot-postgres
    environment:
      POSTGRES_DB: preppilot
      POSTGRES_USER: preppilot
      POSTGRES_PASSWORD: preppilot
    ports:
      - "5432:5432"
    volumes:
      - preppilot-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preppilot -d preppilot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  preppilot-pgdata:
